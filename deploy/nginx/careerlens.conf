# CareerLens — тесты для карьеры: https://careerlens.denisenkosergey.ru
# Статическая сборка Vite в /var/www/careerlens. Сертификат и редирект на HTTPS добавляет certbot --nginx.
server {
    server_name careerlens.denisenkosergey.ru;

    root /var/www/careerlens;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    # Сборка Vite: имена с хешем, можно кэшировать навсегда
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }

    # Маршруты React Router (/tests/holland/result и т. п.) отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/careerlens.denisenkosergey.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/careerlens.denisenkosergey.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = careerlens.denisenkosergey.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name careerlens.denisenkosergey.ru;
    return 404; # managed by Certbot


}